<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173B67" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Private, offline-first Torah learning and chazarah planning.">
  <title>VeShinantam</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    html { color-scheme: light dark; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #f7f8fc; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    canvas { outline: none; }
    @media (prefers-color-scheme: dark) { html, body { background: #111318; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <script src="supabase-config.js"></script>
  <script src="entity-sync.js"></script>
  <script src="preset-updates.js"></script>
  <script>
    (() => {
      const STATE_KEY = 'veshinantam.web.v1';
      const SESSION_KEY = 'veshinantam.supabase.session.v1';
      const REVISION_KEY = 'veshinantam.supabase.revision.v1';
      const STATUS_KEY = 'veshinantam.supabase.status.v1';
      const CONFLICT_KEY = 'veshinantam.supabase.conflict.v1';
      const REQUEST_TIMEOUT_MS = 30000;
      const API_RETRY_DELAYS_MS = [600, 1800];
      const PUSH_BATCH_SIZE = 100;
      const PULL_PAGE_SIZE = 1000;
      const config = window.VESHINANTAM_SUPABASE || {};
      const configured = Boolean(config.url && config.publishableKey);
      let syncPromise = null;

      const setStatus = (value) => localStorage.setItem(STATUS_KEY, value);
      const reload = () => setTimeout(() => window.location.reload(), 80);
      const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
      const timedFetch = async (url, options = {}) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
        try {
          return await fetch(url, { ...options, signal: controller.signal });
        } catch (error) {
          if (error?.name === 'AbortError') throw new Error('The sync server did not respond within 30 seconds.');
          throw error;
        } finally {
          clearTimeout(timer);
        }
      };
      const errorMessage = error => {
        const fallback = 'Please try again.';
        let message = error?.message || fallback;
        try {
          const parsed = JSON.parse(message);
          message = [parsed.code, parsed.message || parsed.msg || parsed.details].filter(Boolean).join(': ') || fallback;
        } catch (_) { /* The error was already plain text. */ }
        if (message.includes('PGRST003')) return 'The sync server is busy (PGRST003). Wait a minute and try again.';
        return message;
      };
      const normalize = (value) => JSON.stringify(typeof value === 'string' ? JSON.parse(value) : value);
      const decodeJwt = (token) => {
        try {
          const body = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          return JSON.parse(decodeURIComponent(Array.from(atob(body), c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')));
        } catch (_) { return {}; }
      };
      const readSession = () => {
        try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (_) { return null; }
      };
      const saveSession = (accessToken, refreshToken) => {
        const claims = decodeJwt(accessToken);
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          accessToken,
          refreshToken,
          email: claims.email || '',
          expiresAt: Number(claims.exp || 0) * 1000
        }));
      };

      if (configured && location.hash.includes('access_token=')) {
        const values = new URLSearchParams(location.hash.slice(1));
        const accessToken = values.get('access_token');
        const refreshToken = values.get('refresh_token');
        if (accessToken && refreshToken) {
          saveSession(accessToken, refreshToken);
          localStorage.removeItem(REVISION_KEY);
          localStorage.removeItem(CONFLICT_KEY);
          setStatus('Signed in. Choose Sync now to connect this device.');
          history.replaceState(null, '', location.pathname + location.search);
        }
      }

      const authenticatedSession = async () => {
        const session = readSession();
        if (!session) throw new Error('Please sign in again.');
        if (session.expiresAt > Date.now() + 60000) return session;
        const response = await timedFetch(`${config.url}/auth/v1/token?grant_type=refresh_token`, {
          method: 'POST',
          headers: { 'apikey': config.publishableKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: session.refreshToken })
        });
        if (!response.ok) throw new Error('Your session expired. Please sign in again.');
        const refreshed = await response.json();
        saveSession(refreshed.access_token, refreshed.refresh_token);
        return readSession();
      };
      const api = async (path, options = {}) => {
        const session = await authenticatedSession();
        for (let attempt = 0; ; attempt += 1) {
          try {
            const response = await timedFetch(`${config.url}${path}`, {
              ...options,
              headers: {
                'apikey': config.publishableKey,
                'Authorization': `Bearer ${session.accessToken}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            if (response.ok) return response.status === 204 ? null : response.json();
            const detail = await response.text();
            const retryable = [408, 502, 503, 504].includes(response.status);
            if (!retryable || attempt >= API_RETRY_DELAYS_MS.length) {
              throw new Error(detail || `Sync failed (${response.status}).`);
            }
          } catch (error) {
            const isNetworkFailure = error?.name === 'TypeError' || error?.message?.includes('did not respond within');
            if (!isNetworkFailure || attempt >= API_RETRY_DELAYS_MS.length) throw error;
          }
          setStatus(`The cloud server is busy; retrying (${attempt + 1}/${API_RETRY_DELAYS_MS.length})…`);
          await wait(API_RETRY_DELAYS_MS[attempt] + Math.floor(Math.random() * 250));
        }
      };
      const push = async (state, expectedRevision) => {
        const value = await api('/rest/v1/rpc/sync_learning_snapshot', {
          method: 'POST',
          body: JSON.stringify({ expected_revision: Number(expectedRevision), new_payload: JSON.parse(state) })
        });
        const revision = Number(value);
        localStorage.setItem(REVISION_KEY, String(revision));
        localStorage.removeItem(CONFLICT_KEY);
        setStatus('Synced successfully.');
      };

      window.veshinantamAccountState = () => {
        const session = readSession();
        return JSON.stringify({
          configured,
          email: session?.email || null,
          status: localStorage.getItem(STATUS_KEY),
          conflict: Boolean(localStorage.getItem(CONFLICT_KEY)),
          syncing: Boolean(syncPromise)
        });
      };
      const authError = async (response) => {
        const text = await response.text();
        try {
          const value = JSON.parse(text);
          return value.msg || value.message || text;
        } catch (_) { return text || `Request failed (${response.status}).`; }
      };
      window.veshinantamPasswordSignIn = async (email, password) => {
        if (!configured) return;
        setStatus('Signing in…');
        try {
          const response = await timedFetch(`${config.url}/auth/v1/token?grant_type=password`, {
            method: 'POST',
            headers: { 'apikey': config.publishableKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim(), password })
          });
          if (!response.ok) throw new Error(await authError(response));
          const session = await response.json();
          saveSession(session.access_token, session.refresh_token);
          localStorage.removeItem(REVISION_KEY);
          localStorage.removeItem(CONFLICT_KEY);
          setStatus('Signed in. Choose Sync now to connect this device.');
        } catch (error) { setStatus(`Error signing in: ${error.message || 'Please try again.'}`); }
        reload();
      };
      window.veshinantamPasswordCreateAccount = async (email, password) => {
        if (!configured) return;
        setStatus('Creating account…');
        try {
          const redirectTo = location.origin + location.pathname;
          const response = await timedFetch(`${config.url}/auth/v1/signup?redirect_to=${encodeURIComponent(redirectTo)}`, {
            method: 'POST',
            headers: { 'apikey': config.publishableKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim(), password })
          });
          if (!response.ok) throw new Error(await authError(response));
          const result = await response.json();
          if (result.access_token && result.refresh_token) {
            saveSession(result.access_token, result.refresh_token);
            localStorage.removeItem(REVISION_KEY);
            localStorage.removeItem(CONFLICT_KEY);
            setStatus('Account created. Choose Sync now to connect this device.');
          } else {
            setStatus('Account created. Check your email to confirm it, then sign in with your password.');
          }
        } catch (error) { setStatus(`Error creating the account: ${error.message || 'Please try again.'}`); }
        reload();
      };
      const legacySnapshotSync = async (state) => {
        if (!configured) return;
        setStatus('Synchronizing…');
        try {
          const rows = await api('/rest/v1/learning_snapshots?select=payload,revision&limit=1');
          const remote = rows && rows[0];
          if (!remote) {
            await push(state, 0);
          } else {
            const localRevision = localStorage.getItem(REVISION_KEY);
            if (localRevision === null || Number(localRevision) !== Number(remote.revision)) {
              if (normalize(state) === normalize(remote.payload)) {
                localStorage.setItem(REVISION_KEY, String(remote.revision));
                setStatus('Already up to date.');
              } else {
                localStorage.setItem(CONFLICT_KEY, JSON.stringify({ payload: remote.payload, revision: remote.revision }));
                setStatus('Choose which copy to keep.');
              }
            } else if (normalize(state) === normalize(remote.payload)) {
              setStatus('Already up to date.');
            } else {
              await push(state, remote.revision);
            }
          }
        } catch (_) { setStatus('Error synchronizing. Your device data is unchanged.'); }
        reload();
      };
      const incrementalEntitySync = async (state) => {
        setStatus('Preparing device changes…');
        const parsedState = JSON.parse(state);
        await window.veshinantamEnsureEntitySeed(parsedState);
        const mutations = await window.veshinantamReadOutbox();
        let remoteWonConflict = false;
        const conflictRecords = [];
        let uploaded = 0;
        for (let offset = 0; offset < mutations.length; offset += PUSH_BATCH_SIZE) {
          const batch = mutations.slice(offset, offset + PUSH_BATCH_SIZE);
          setStatus(`Uploading device changes (${uploaded}/${mutations.length})…`);
          const rows = await api('/rest/v1/rpc/apply_learning_mutations', {
            method: 'POST',
            body: JSON.stringify({ p_mutations: batch.map(mutation => ({
              mutation_id: mutation.mutationId,
              entity_type: mutation.entityType,
              entity_id: mutation.entityId,
              base_revision: Number(mutation.baseRevision || 0),
              payload: mutation.deleted ? null : mutation.payload,
              deleted: Boolean(mutation.deleted)
            })) })
          });
          const results = new Map((rows || []).map(result => [result.mutation_id, result]));
          if (results.size !== batch.length) throw new Error('The sync server returned an incomplete mutation batch.');
          for (const mutation of batch) {
            const result = results.get(mutation.mutationId);
            if (!result) throw new Error(`The sync server omitted mutation ${mutation.mutationId}.`);
            remoteWonConflict = remoteWonConflict || Boolean(result.conflict);
            if (result.conflict) conflictRecords.push({
              entity_type: mutation.entityType,
              entity_id: mutation.entityId,
              payload: result.remote_payload,
              deleted: result.remote_deleted,
              revision: result.revision,
              updated_at: new Date().toISOString()
            });
            await window.veshinantamRemoveOutbox(mutation.entityType, mutation.entityId);
            uploaded += 1;
          }
        }
        if (conflictRecords.length) await window.veshinantamApplyEntityRecords(conflictRecords);
        let cursor = await window.veshinantamGetSyncCursor();
        let downloaded = 0;
        let records;
        do {
          setStatus(`Downloading cloud changes (${downloaded} received)…`);
          records = await api(`/rest/v1/learning_entities?select=entity_type,entity_id,payload,deleted,revision,updated_at&revision=gt.${cursor}&order=revision.asc&limit=${PULL_PAGE_SIZE}`);
          if (records.length) {
            setStatus(`Applying cloud changes (${downloaded + records.length} received)…`);
            await window.veshinantamApplyEntityRecords(records);
            cursor = Math.max(...records.map(record => Number(record.revision)));
            await window.veshinantamSetSyncCursor(cursor);
            downloaded += records.length;
          }
        } while (records.length === PULL_PAGE_SIZE);
        setStatus(remoteWonConflict ? 'Synchronized. A newer cloud change was kept for one item.' : 'Synced successfully.');
        reload();
      };
      window.veshinantamSync = state => {
        if (!configured) return Promise.resolve();
        if (syncPromise) return syncPromise;
        syncPromise = (async () => {
          try {
            if (config.entitySyncEnabled !== true) throw new Error('Entity synchronization is not enabled in this build.');
            await incrementalEntitySync(state);
          } catch (error) {
            setStatus(`Sync failed: ${errorMessage(error)} Your device data was not replaced.`);
            reload();
          } finally {
            syncPromise = null;
          }
        })();
        return syncPromise;
      };
      window.veshinantamResolveSync = async (choice, state) => {
        try {
          const conflict = JSON.parse(localStorage.getItem(CONFLICT_KEY) || 'null');
          if (!conflict) throw new Error('No pending conflict.');
          if (choice === 'cloud') {
            window.veshinantamPersistState(JSON.stringify(conflict.payload));
            localStorage.setItem(REVISION_KEY, String(conflict.revision));
            localStorage.removeItem(CONFLICT_KEY);
            setStatus('Cloud copy restored on this device.');
          } else {
            await push(state, conflict.revision);
          }
        } catch (_) { setStatus('Error resolving the sync choice. No data was replaced.'); }
        reload();
      };
      window.veshinantamSignOut = () => {
        localStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(REVISION_KEY);
        localStorage.removeItem(CONFLICT_KEY);
        setStatus('Signed out. Device data remains available offline.');
        reload();
      };
    })();
  </script>
  <script>
    (() => {
      const CACHE_PREFIX = 'veshinantam.sefaria-text.';
      const CACHE_INDEX = 'veshinantam.sefaria-text-index';
      const requests = new Map();
      const cacheName = key => CACHE_PREFIX + encodeURIComponent(key);
      const cacheIndex = () => {
        try { return JSON.parse(localStorage.getItem(CACHE_INDEX) || '[]'); }
        catch (_) { return []; }
      };
      window.veshinantamReadSefariaCache = key => localStorage.getItem(cacheName(key));
      window.veshinantamWriteSefariaCache = (key, raw) => {
        if (typeof raw !== 'string' || raw.length > 2000000) return;
        const name = cacheName(key);
        let index = cacheIndex().filter(entry => entry !== name);
        const store = () => {
          localStorage.setItem(name, raw);
          index.push(name);
          while (index.length > 10) localStorage.removeItem(index.shift());
          localStorage.setItem(CACHE_INDEX, JSON.stringify(index));
        };
        try { store(); }
        catch (_) {
          while (index.length) {
            localStorage.removeItem(index.shift());
            try { store(); return; } catch (_) { /* Evict another old passage. */ }
          }
        }
      };
      window.veshinantamBeginSefariaRequest = (key, reference, versionLines) => {
        if (requests.get(key)?.status === 'loading') return;
        requests.set(key, { status: 'loading' });
        const params = new URLSearchParams({ return_format: 'text_only' });
        String(versionLines || '').split('\n').filter(Boolean).forEach(version => params.append('version', version));
        const url = 'https://www.sefaria.org/api/v3/texts/' + encodeURIComponent(reference) + '?' + params.toString();
        fetch(url, { headers: { Accept: 'application/json' } }).then(async response => {
          if (!response.ok) throw new Error('Sefaria returned ' + response.status + '.');
          const declared = Number(response.headers.get('content-length') || 0);
          if (declared > 2000000) throw new Error('The passage is too large to display.');
          const body = await response.text();
          if (body.length > 2000000) throw new Error('The passage is too large to display.');
          requests.set(key, { status: 'ready', body });
        }).catch(error => requests.set(key, { status: 'error', error: error?.message || 'The text could not be loaded.' }));
      };
      window.veshinantamSefariaRequestStatus = key => requests.get(key)?.status || 'idle';
      window.veshinantamSefariaRequestBody = key => requests.get(key)?.body || null;
      window.veshinantamSefariaRequestError = key => requests.get(key)?.error || null;
    })();
  </script>
  <script>
    Promise.all([window.veshinantamStorageReady, window.veshinantamPresetCatalogReady]).finally(() => {
      const application = document.createElement('script');
      application.src = 'veshinantam.js';
      document.body.appendChild(application);
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; window.location.reload(); }
      });
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    }

    const modelContext = document.modelContext;
    if (modelContext?.registerTool) {
      const readState = () => JSON.parse(window.veshinantamReadState() || '{"tasks":[]}');
      Promise.resolve(modelContext.registerTool({
        name: 'list_due_learning_tasks',
        title: 'List due learning tasks',
        description: 'List the Torah learning and chazarah tasks currently stored on this device.',
        inputSchema: { type: 'object', properties: {}, additionalProperties: false },
        annotations: { readOnlyHint: true, untrustedContentHint: false },
        execute() {
          const state = readState();
          return { tasks: (state.tasks || []).map(task => ({
            id: task.id,
            reference: task.referenceEnglish,
            type: task.type,
            dueDate: task.dueDate,
            completed: task.completed
          })) };
        }
      })).catch(() => {});

      Promise.resolve(modelContext.registerTool({
        name: 'set_learning_task_completion',
        title: 'Set learning task completion',
        description: 'Mark one locally stored learning or chazarah task complete or incomplete and refresh the visible app.',
        inputSchema: {
          type: 'object',
          properties: {
            taskId: { type: 'string' },
            completed: { type: 'boolean' }
          },
          required: ['taskId', 'completed'],
          additionalProperties: false
        },
        annotations: { readOnlyHint: false, untrustedContentHint: false },
        execute(input) {
          if (!input || typeof input.taskId !== 'string' || typeof input.completed !== 'boolean') {
            throw new Error('taskId and completed are required');
          }
          const state = readState();
          const task = (state.tasks || []).find(candidate => candidate.id === input.taskId);
          if (!task) throw new Error('Task not found');
          task.completed = input.completed;
          const now = new Date();
          task.completedAt = input.completed ? now.toISOString() : null;
          task.completionLocalDate = input.completed ? `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}` : null;
          task.completionZoneId = input.completed ? (Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC') : null;
          task.updatedAt = now.toISOString();
          window.veshinantamPersistState(JSON.stringify(state));
          setTimeout(() => window.location.reload(), 150);
          return { taskId: task.id, completed: task.completed };
        }
      })).catch(() => {});
    }
  </script>
</body>
</html>
