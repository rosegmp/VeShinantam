name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate shared, Android, and web behavior
        run: |
          node --test --test-isolation=none scripts/entity-sync-policy.test.cjs
          node --test --test-isolation=none scripts/indexeddb-recovery.test.cjs
          node --test --test-isolation=none scripts/service-worker-recovery.test.cjs
          node --test --test-isolation=none scripts/two-device-sync.test.cjs
          ./gradlew kotlinWasmUpgradePackageLock --rerun-tasks
          ./gradlew -PfullBrowserMatrix=true :shared:allTests :app:testDebugUnitTest :webApp:allTests

      - name: Build production web app
        run: |
          ./gradlew :webApp:stageSite

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
